[project]
name = "atomgen"
version = "0.1.0"
description = "A framework for modeling atomistic data with transformers"
readme = "README.md"
authors = [{name = "Vector AI Engineering", email = "ai_engineering@vectorinstitute.ai"}]
license = "Apache-2.0"
repository = "https://github.com/VectorInstitute/atomgen"
documentation = "https://vectorinstitute.github.io/atomgen/"
requires-python = ">=3.10,<4.0"
dependencies = [
    "torch>=2.12.1", # Pinning version to address vulnerability CVE-2025-3000
    "transformers>=4.48.0",
    "datasets>=2.19.0",
    "wandb>=0.16.6",
    "accelerate>=0.29.3",
    "torch-geometric>=2.5.3",
    "idna>=3.15", # Pinning version to address vulnerability CVE-2026-45409
    "scipy>=1.15.3",
    "scikit-learn>=1.6.1",
    "urllib3>=2.7.0",
    "filelock>=3.20.3",
    "pyarrow>=23.0.1", # Pinning version to address vulnerability PYSEC-2026-113
]

[dependency-groups]
test = [
    "pytest>=9.0.3",
    "pre-commit>=4.0.0",
    "pytest-cov>=3.0.0",
    "codecov>=2.1.13",
    "mypy>=1.7.0",
    "ruff>=0.2.0",
    "nbqa[toolchain]>=1.7.0",
    "pip-audit>=2.7.1",
    "pygments>=2.20.0", # Pinning version to address vulnerability CVE-2026-4539
    "aiohttp>=3.14.1", # Pinning version to address vulnerabilities CVE-2026-54273 through CVE-2026-54280
    "virtualenv>=20.36.1",
    "pip>=26.1.2", # Pinning version to address vulnerability CVE-2026-3219 and PYSEC-2026-196
]
docs = [
    "jinja2>=3.1.6", # Pinning version to address vulnerability GHSA-cpwx-vrp4-4pq7
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.15",
    "pymdown-extensions>=10.21.3", # Pinning version for compatibility with pygments>=2.20.0 (CVE-2026-4539 fix)
    "mkdocstrings>=0.24.1",
    "mkdocstrings-python>=1.10.0",
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
    "tornado>=6.5.6", # Pinning version to address vulnerability CVE-2026-49854
]

# Default dependency groups to be installed
[tool.uv]
default-groups = ["test", "docs"]

[tool.mypy]
ignore_missing_imports = true
install_types = true
pretty = true
namespace_packages = true
explicit_package_bases = true
non_interactive = true
warn_unused_configs = true
allow_any_generics = false
allow_subclassing_any = false
allow_untyped_calls = false
allow_untyped_defs = false
allow_incomplete_defs = false
check_untyped_defs = true
allow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[tool.ruff]
include = ["*.py", "pyproject.toml", "*.ipynb"]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "COM", # flake8-commas
    "C4", # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ICN", # flake8-import-conventions
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "W", # pycodestyle
    "N", # pep8-naming
    "ERA", # eradicate
    "PL", # pylint
]
fixable = ["A", "B", "COM", "C4", "RET", "SIM", "ICN", "Q", "RSE", "D", "E", "F", "I", "W", "N", "ERA", "PL"]
ignore = [
    "B905", # `zip()` without an explicit `strict=` parameter
    "E501", # line too long
    "D203", # 1 blank line required before class docstring
    "D213", # Multi-line docstring summary should start at the second line
    "PLR2004", # Replace magic number with named constant
    "PLR0913", # Too many arguments
    "COM812", # Missing trailing comma
]

# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.pep8-naming]
ignore-names = ["X*", "setUp"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.pytest.ini_options]
markers = [
    "integration_test: marks tests as integration tests",
]

[tool.coverage]
    [tool.coverage.run]
    source=["atomgen"]
    omit=["tests/*", "*__init__.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atomgen"]
